<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>게임 개발 현황</title>

    <link rel="stylesheet" href="web01.css">
</head>
<script>
    function openTab(tabId, clickedMenu) {
        // 1. 모든 탭 구역(.tab-area) 숨기기
        const areas = document.querySelectorAll('.tab-area');
        areas.forEach(area => {
            area.style.display = 'none';
        });

        // 2. 선택한 구역만 보이기 ('tab-home' 또는 'tab-project')
        document.getElementById('tab-' + tabId).style.display = 'block';

        // 3. 상단 메뉴 선택 표시(.active) 옮기기
        const menus = document.querySelectorAll('.menu-item');
        menus.forEach(menu => {
            menu.classList.remove('active');
        });
        if (clickedMenu) {
            clickedMenu.classList.add('active');
        }
    }
</script>

<body>

    <h2>게임 개발 현황</h2>
    <p>Frontend Web Develpor</p><br>
    <div class="menu">
    <div class="menu-item active" onclick="openTab('home', this)">홈</div>
    <div class="menu-item" onclick="openTab('project', this)">프로젝트</div>
    <div class="menu-item" onclick="openTab('video', this)">시연영상</div>
</div>
  </div>

</div>
